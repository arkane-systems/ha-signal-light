        Integer priority value.  Higher values take precedence over lower ones.
      required: false
      default: 50
      selector:
        number:
          min: 1
          max: 1000
          mode: box
    brightness:
      name: Brightness
      description: Brightness level (0–255).
      required: false
      selector:
        number:
          min: 0
          max: 255
    brightness_pct:
      name: Brightness (%)
      description: Brightness as a percentage (0–100).
      required: false
      selector:
        number:
