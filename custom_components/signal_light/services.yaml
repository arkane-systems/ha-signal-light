          max: 100
          unit_of_measurement: "%"
    color_temp_kelvin:
      name: Colour temperature (K)
      description: Colour temperature in Kelvin (1000–10000).
      required: false
      selector:
        color_temp:
          unit: kelvin
    hs_color:
      name: Hue/Saturation colour
      description: Hue (0–360) and saturation (0–100) as a two-element list.
      required: false
      example: "[120, 100]"
      selector:
        object:
    rgb_color:
      name: RGB colour
      description: Red, green, blue values (0–255 each) as a three-element list.
      required: false
      example: "[255, 0, 128]"
      selector:
        object:
    color_name:
      name: Named colour
      description: CSS3-like color name (for example "red", "deepskyblue").
      required: false
      selector:
        text:
    effect:
      name: Effect
      description: Named light effect.
      required: false
      selector:
        text:
    transition:
      name: Transition
      description: Transition time in seconds.
      required: false
      selector:
        number:
          min: 0
          max: 300
          unit_of_measurement: s

clear_accent:
  name: Clear Accent
  description: >
    Remove a named accent from the accent priority stack.  If the cleared
